name: Tool Hubs Android CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-hubs-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APKs (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Tool Hubs
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build release APKs with debug keys
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: gradle :tools:calculator:assembleRelease :tools:music-analyzer:assembleRelease --stacktrace --no-parallel --max-workers=2

      - name: Upload downloadable release APKs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: tool-hubs-release-apks-${{ github.run_number }}
          path: |
            tools/calculator/build/outputs/apk/release/*.apk
            tools/music-analyzer/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
