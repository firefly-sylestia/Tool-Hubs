name: Tool Hubs Android CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-hubs-android-${ github.workflow }-${ github.ref }
  cancel-in-progress: true

jobs:
  prune:
    name: Prune stale artifacts and caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete artifacts and caches older than a day
        continue-on-error: true
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
        run: |
          set +e
          set -o pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.created_at | fromdateiso8601) < (now - 86400)) | .id' \
            > "$RUNNER_TEMP/stale-artifacts.txt"
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$repo/actions/artifacts/$id" > /dev/null || echo "artifact $id already gone"
          done < "$RUNNER_TEMP/stale-artifacts.txt"
          gh api --paginate "repos/$repo/actions/caches?per_page=100" \
            --jq '.actions_caches[] | .id' > "$RUNNER_TEMP/caches.txt"
          tail -n +11 "$RUNNER_TEMP/caches.txt" | while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$repo/actions/caches/$id" > /dev/null || echo "cache $id already gone"
          done
          gh api "repos/$repo/actions/cache/usage" \
            --jq '"caches after: \(.active_caches_count), \(.active_caches_size_in_bytes / 1048576 | floor) MB"'

  build:
    name: Build ${ matrix.name } release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chime
            task: :tools:chime:assembleRelease
            apk: tools/chime/build/outputs/apk/release/*.apk
          - name: network-switcher
            task: :tools:network-switcher:assembleRelease
            apk: tools/network-switcher/build/outputs/apk/release/*.apk
          - name: data-warden
            task: :tools:data-warden:assembleRelease
            apk: tools/data-warden/build/outputs/apk/release/*.apk
          - name: june
            task: :tools:june:assembleRelease
            apk: tools/june/build/outputs/apk/release/*.apk

    steps:
      - name: Check out Tool Hubs
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create repository-local debug keystore
        run: |
          mkdir -p .ci
          keytool -genkeypair \
            -keystore .ci/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          KEYSTORE_BASE64: ${ secrets.KEYSTORE_BASE64 }
          KEYSTORE_PASSWORD: ${ secrets.KEYSTORE_PASSWORD }
          KEY_ALIAS: ${ secrets.KEY_ALIAS }
          KEY_PASSWORD: ${ secrets.KEY_PASSWORD }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p .ci
            echo "$KEYSTORE_BASE64" | base64 -d > .ci/release.keystore
            export RELEASE_KEYSTORE_PATH=.ci/release.keystore
            export RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
            echo "Signing with the repository release keystore."
          else
            echo "KEYSTORE_BASE64 is not set; falling back to the repository debug signing key."
          fi
          gradle ${ matrix.task } --stacktrace --no-daemon

      - name: Upload downloadable release APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: tool-hubs-${ matrix.name }-${ github.run_number }
          path: ${ matrix.apk }
          if-no-files-found: error
          retention-days: 1

  release:
    name: Attach the APKs to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the release APKs
        uses: actions/download-artifact@v5
        with:
          path: apks

      - name: Attach them to the release
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
          shopt -s nullglob
          for apk in apks/*/*.apk; do
            module="$(basename "$(dirname "$apk")")"
            name="${module#tool-hubs-}"
            cp "$apk" "release-${name%-*}.apk"
          done
          ls -l release-*.apk
          gh release upload "$GITHUB_REF_NAME" release-*.apk --clobber --repo "$GITHUB_REPOSITORY"
