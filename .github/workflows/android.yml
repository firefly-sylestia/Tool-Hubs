name: Tool Hubs Android CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-hubs-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Tool Hubs
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        run: gradle :tools:calculator:assembleDebug --stacktrace

      - name: Upload downloadable debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: tool-hubs-debug-apk-${{ github.run_number }}
          path: tools/calculator/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
