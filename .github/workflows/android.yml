name: Tool Hubs Android CI

on:
  push:
    branches: [main, dev]
    # A release tag is pushed after the version bump, so it has to build too: a tag push started no
    # run at all before this, which left every release pointing at a commit CI never touched.
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-hubs-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    name: Prune stale artifacts and caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job on purpose: only the prune steps need write access to the repository's own
    # Actions data, and the build job checks out and runs repository code, so it must not have it.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete artifacts and caches older than a day
        # Housekeeping, not verification: it must never turn a run red the way it did when a bare
        # `gh cache list` had no checkout to read a git remote from and failed the job, which then
        # skipped the build. Each deletion is guarded, and the log records whatever did not work.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          repo="$GITHUB_REPOSITORY"

          # Artifact storage is a small, account-wide quota, and its usage figure only refreshes every
          # 6-12 hours, so waiting for the one-day retention to take effect is not enough: it stayed
          # over quota, which failed the upload step on every module of every run.
          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.created_at | fromdateiso8601) < (now - 86400)) | .id' \
            > "$RUNNER_TEMP/stale-artifacts.txt"
          echo "artifacts older than a day: $(wc -l < "$RUNNER_TEMP/stale-artifacts.txt")"
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$repo/actions/artifacts/$id" > /dev/null || echo "artifact $id already gone"
          done < "$RUNNER_TEMP/stale-artifacts.txt"

          # Gradle caches reach gigabytes each and one is written per branch and per run, so they pile
          # up far past the artifacts. Keep the ten newest so ordinary builds stay warm and delete the
          # rest; a cache is only a download saved, never data.
          # `--repo` is required here: this job has no checkout, so gh cannot infer the repository
          # from a git remote and aborts with "failed to run git: not a git repository".
          gh cache list --repo "$repo" --limit 100 --sort created_at --order desc \
            --json id > "$RUNNER_TEMP/caches.json"
          echo "caches before: $(gh api "repos/$repo/actions/cache/usage" --jq '.active_caches_count')"
          jq -r '.[10:] | .[] | .id' "$RUNNER_TEMP/caches.json" | while read -r id; do
            [ -n "$id" ] || continue
            gh cache delete "$id" --repo "$repo" > /dev/null \
              || echo "cache $id: already gone or not deletable"
          done
          gh api "repos/$repo/actions/cache/usage" \
            --jq '"caches after: \(.active_caches_count), \(.active_caches_size_in_bytes / 1048576 | floor) MB"'

  build:
    name: Build ${{ matrix.name }} release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: calculator
            task: :tools:calculator:assembleRelease
            apk: tools/calculator/build/outputs/apk/release/*.apk
          - name: music-analyzer
            task: :tools:music-analyzer:assembleRelease
            apk: tools/music-analyzer/build/outputs/apk/release/*.apk
          - name: music-visualizer
            task: :tools:music-visualizer:assembleRelease
            apk: tools/music-visualizer/build/outputs/apk/release/*.apk
          - name: network-switcher
            task: :tools:network-switcher:assembleRelease
            apk: tools/network-switcher/build/outputs/apk/release/*.apk
          - name: data-warden
            task: :tools:data-warden:assembleRelease
            apk: tools/data-warden/build/outputs/apk/release/*.apk

    steps:
      - name: Check out Tool Hubs
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create repository-local debug keystore
        run: |
          mkdir -p .ci
          keytool -genkeypair \
            -keystore .ci/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p .ci
            echo "$KEYSTORE_BASE64" | base64 -d > .ci/release.keystore
            export RELEASE_KEYSTORE_PATH=.ci/release.keystore
            export RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
            echo "Signing with the release keystore from repository secrets."
          else
            echo "KEYSTORE_BASE64 is not set; falling back to the debug signing key."
          fi
          gradle ${{ matrix.task }} --stacktrace --no-daemon

      - name: Upload downloadable release APK
        if: success()
        # The build is what this workflow is for; the artifact is a convenience. An account-level
        # artifact storage quota must not turn a successful build into a failed run, which is what
        # happened while 90-day artifacts from old runs filled the account's storage.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: tool-hubs-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ matrix.apk }}
          if-no-files-found: error
          # One day only: these APKs are debug-signed build outputs, and the 90-day default filled the
          # account's artifact storage quota, which failed the upload step on every matrix leg.
          retention-days: 1
